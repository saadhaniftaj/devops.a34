version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    container_name: cs423-frontend
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    container_name: cs423-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=host.docker.internal
      - DB_USER=appuser
      - DB_PASSWORD=AppPassword123!
      - DB_NAME=cs423_app
    networks:
      - app-network
    depends_on:
      - frontend

networks:
  app-network:
    driver: bridge
