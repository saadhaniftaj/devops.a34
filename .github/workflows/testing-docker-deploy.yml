name: Deploy to Testing Environment (Docker)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger button

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_FRONTEND: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
  ECR_REPOSITORY_BACKEND: ${{ secrets.ECR_REPOSITORY_BACKEND }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Build Frontend
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # Build Backend
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      # Unit Testing
      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false

      - name: Run Backend Tests
        run: |
          cd backend
          npm test -- --coverage

      # Code Analysis/Linting
      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint || true

      - name: Lint Backend
        run: |
          cd backend
          npm run lint || true

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push Frontend image
      - name: Build, tag, and push frontend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG ./frontend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

      # Build and push Backend image
      - name: Build, tag, and push backend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG ./backend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest

      # Deploy to Testing EC2
      - name: Deploy to Testing EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_FRONTEND: ${{ env.ECR_REPOSITORY_FRONTEND }}
          ECR_REPOSITORY_BACKEND: ${{ env.ECR_REPOSITORY_BACKEND }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.TESTING_EC2_HOST }}
          username: ${{ secrets.TESTING_EC2_USER }}
          key: ${{ secrets.TESTING_EC2_SSH_KEY }}
          script: |
            # Login to ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            # Pull latest images
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
            
            # Stop and remove existing containers
            docker stop frontend backend || true
            docker rm frontend backend || true
            
            # Create docker-compose file
            cat > ~/docker-compose.yml <<EOF
            version: '3.8'
            services:
              backend:
                image: $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
                container_name: backend
                ports:
                  - "5000:5000"
                restart: unless-stopped
                environment:
                  - NODE_ENV=production
                  - PORT=5000
              
              frontend:
                image: $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
                container_name: frontend
                ports:
                  - "80:80"
                depends_on:
                  - backend
                restart: unless-stopped
            EOF
            
            # Start containers
            docker-compose -f ~/docker-compose.yml up -d
            
            # Clean up old images
            docker image prune -f

      - name: Send Success Notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Testing Deployment Successful (Docker) - PR #${{ github.event.pull_request.number }}"
          to: ${{ secrets.QA_EMAIL }}
          from: GitHub Actions
          body: |
            Testing deployment completed successfully!
            
            Pull Request: #${{ github.event.pull_request.number }}
            Branch: ${{ github.head_ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.event.pull_request.user.login }}
            
            Access the deployed application at:
            http://${{ secrets.TESTING_EC2_HOST }}
            
            Docker images pushed to ECR:
            - Frontend: ${{ env.ECR_REPOSITORY_FRONTEND }}:${{ github.sha }}
            - Backend: ${{ env.ECR_REPOSITORY_BACKEND }}:${{ github.sha }}
            
            Please test the following:
            - Frontend is accessible
            - Backend API is responding
            - All features are working as expected
            
            GitHub Actions Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Failure Notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Testing Deployment Failed (Docker) - PR #${{ github.event.pull_request.number }}"
          to: ${{ secrets.QA_EMAIL }},${{ github.event.pull_request.user.email }}
          from: GitHub Actions
          body: |
            Testing deployment failed!
            
            Pull Request: #${{ github.event.pull_request.number }}
            Branch: ${{ github.head_ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.event.pull_request.user.login }}
            
            Please check the workflow logs for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

